; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cyd

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps = 
    adafruit/Adafruit NeoPixel@^1.12.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200
build_src_filter = +<main.cpp>

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM11
monitor_port = COM11
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<main.cpp>
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.0.4
build_flags = 
    -D USER_SETUP_LOADED=1
    ; 顯示器驅動與解析度 (CYD 2.8" ILI9341)
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; 顯示器 SPI 針腳
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; SPI 通訊頻率
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; 字型載入
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; 觸控晶片 (XPT2046) 針腳定義 (軟體/專屬 SPI)
    -D XPT2046_IRQ=36
    -D XPT2046_MOSI=32
    -D XPT2046_MISO=39
    -D XPT2046_CLK=25
    -D XPT2046_CS=33
    ; 板載 RGB LED 針腳 (注意：Active LOW 低電位點亮)
    -D CYD_LED_RED=4
    -D CYD_LED_GREEN=16
    -D CYD_LED_BLUE=17
    ; 板載光敏電阻與 DAC 輸出
    -D CYD_LDR=34
    -D CYD_AUDIO_OUT=26

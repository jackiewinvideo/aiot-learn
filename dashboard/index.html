<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5fbff">
  <title>物聯網溫溼度儀表板</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14324b;
      --muted: #71859a;
      --blue: #3378f6;
      --cyan: #25c6d8;
      --orange: #ff9a54;
      --paper: #ffffff;
      --line: #e8f0f7;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 0%, #e0f7ff 0, transparent 34rem),
        radial-gradient(ellipse at 95% 14%, #fff0dd 0, transparent 30rem),
        #f5f9fd;
    }

    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 42px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
    .brand-mark {
      display: grid; width: 44px; height: 44px; place-items: center; border-radius: 15px;
      color: white; font-size: 22px; background: linear-gradient(140deg, #39d6d1, #4778ff);
      box-shadow: 0 9px 22px #3a9de53b;
    }
    .status {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #e6eef5;
      border-radius: 999px; background: #ffffffcf; color: var(--muted); font-size: 13px; font-weight: 650;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #a9bac8; }
    .status.online .dot { background: #20c88a; box-shadow: 0 0 0 4px #20c88a20; }
    .status.error .dot { background: #ff6376; }

    .hero {
      position: relative; overflow: hidden; padding: 38px 42px; border-radius: 28px; color: white;
      background: linear-gradient(112deg, #3478f6 0%, #398cf5 48%, #28c6d2 100%);
      box-shadow: 0 20px 46px #3278df30;
    }
    .hero::after {
      position: absolute; content: ""; width: 310px; height: 310px; border: 1px solid #ffffff27;
      border-radius: 50%; right: 7%; top: -190px; box-shadow: 0 0 0 30px #ffffff0b, 0 0 0 65px #ffffff08;
    }
    .eyebrow { margin: 0 0 12px; color: #d7faff; font-size: 13px; font-weight: 750; letter-spacing: .16em; }
    h1 { margin: 0; font-size: clamp(29px, 5vw, 46px); line-height: 1.18; letter-spacing: .02em; }
    .hero p:last-child { margin: 14px 0 0; color: #e5f4ff; font-size: 15px; }

    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 30px 2px 15px; }
    .section-heading h2 { margin: 0; font-size: 19px; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .updated { color: var(--muted); font-size: 12px; text-align: right; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .metric {
      position: relative; min-height: 220px; overflow: hidden; padding: 24px; border: 1px solid #edf2f7;
      border-radius: 22px; background: var(--paper); box-shadow: 0 10px 28px #274d6910;
    }
    .metric::after {
      position: absolute; content: ""; width: 170px; height: 170px; right: -56px; bottom: -96px;
      border-radius: 50%; background: var(--glow);
    }
    .metric-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 14px; font-weight: 700; }
    .metric-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; font-size: 20px; background: var(--icon-bg); }
    .metric-value { margin: 17px 0 3px; font-size: clamp(40px, 6vw, 58px); line-height: 1; font-weight: 800; letter-spacing: -.05em; }
    .metric-value small { margin-left: 5px; font-size: 21px; font-weight: 700; letter-spacing: 0; }
    .metric-note { color: var(--muted); font-size: 13px; }
    .metric-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .metric-reading { min-width: 0; }
    .gauge {
      position: relative; z-index: 1; flex: 0 0 132px; width: 132px; height: 132px;
      border-radius: 50%; background: var(--gauge-colors);
    }
    .gauge::before {
      position: absolute; content: ""; inset: 18px; border-radius: 50%; background: white;
    }
    .gauge::after {
      position: absolute; content: ""; inset: 0; border-radius: 50%;
      background: repeating-conic-gradient(#ffffffaa 0deg 1deg, transparent 1deg 36deg);
      mask: radial-gradient(transparent 60%, #000 61%);
    }
    .gauge-label {
      position: absolute; z-index: 2; top: 65%; left: 50%; transform: translateX(-50%);
      padding: 1px 5px; border-radius: 6px; background: white;
      color: var(--ink); font-size: 15px; font-weight: 800;
    }
    .gauge-pointer { position: absolute; z-index: 1; inset: 0; transform: rotate(var(--angle, 0deg)); }
    .gauge-pointer::before {
      position: absolute; content: ""; top: 9px; left: 50%; width: 4px; height: calc(50% - 9px);
      transform: translateX(-50%); border-radius: 4px; background: #14324b;
    }
    .gauge-pointer::after {
      position: absolute; content: ""; top: 50%; left: 50%; width: 12px; height: 12px;
      transform: translate(-50%, -50%); border: 2px solid #14324b; border-radius: 50%; background: white;
    }
    .gauge[data-empty="true"] .gauge-pointer { display: none; }
    .gauge-ranges { position: relative; z-index: 1; margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .gauge-ranges span { display: inline-block; margin-right: 8px; }
    .gauge-ranges span::before { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--color); content: ""; }
    .temperature { --accent: #ff8b55; --icon-bg: #fff0e8; --glow: #fff2e5; }
    .temperature .gauge { --gauge-colors: conic-gradient(#20c88a 0deg 144deg, #f3c83c 144deg 216deg, #f06469 216deg 360deg); }
    .temperature .metric-value { color: #f27b46; }
    .humidity { --accent: #4383f7; --icon-bg: #eaf2ff; --glow: #eaf4ff; }
    .humidity .gauge { --gauge-colors: conic-gradient(#20c88a 0deg 144deg, #f3c83c 144deg 252deg, #f06469 252deg 360deg); }
    .humidity .metric-value { color: #3976e8; }

    .panel { margin-top: 20px; padding: 22px 24px; border: 1px solid #edf2f7; border-radius: 22px; background: white; box-shadow: 0 10px 28px #274d6910; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .panel-head h2 { margin: 0; font-size: 17px; }
    .legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: #ff985d; }
    .legend span:last-child i { background: #4383f7; }
    .chart-wrap { height: 230px; margin-top: 18px; }
    canvas { width: 100%; height: 100%; }
    .records { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    .records th, .records td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); }
    .records th { color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .04em; }
    .records td:not(:first-child) { font-weight: 700; }
    .records tr:last-child td { border-bottom: 0; }
    .empty { padding: 32px 12px; color: var(--muted); text-align: center; font-size: 14px; }
    .footer { margin-top: 22px; color: #94a5b4; font-size: 12px; text-align: center; }
    .error-message { display: none; margin-top: 16px; padding: 13px 16px; border: 1px solid #ffd4d9; border-radius: 12px; background: #fff2f3; color: #ad4351; font-size: 13px; }
    .error-message.visible { display: block; }

    @media (max-width: 640px) {
      .page { width: min(100% - 24px, 540px); padding-top: 20px; }
      .hero { padding: 30px 24px; border-radius: 22px; }
      .cards { grid-template-columns: 1fr; gap: 12px; }
      .metric { min-height: 190px; }
      .section-heading { align-items: start; }
      .updated { max-width: 130px; }
      .panel { padding: 18px 14px; }
      .chart-wrap { height: 200px; }
      .records th, .records td { padding: 10px 5px; font-size: 11px; }
      .records th { font-size: 10px; }
    }
    @media (max-width: 370px) {
      .metric { padding: 18px; }
      .gauge { flex-basis: 110px; width: 110px; height: 110px; }
      .metric-value { font-size: 36px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⌁</span><span>IoT 智慧感測中心</span></div>
      <div id="connection" class="status"><span class="dot"></span><span id="connectionText">正在連線</span></div>
    </header>

    <section class="hero">
      <p class="eyebrow">SMART HOME · LIVE DATA</p>
      <h1>歡迎使用物聯網系統</h1>
      <p>即時掌握環境溫度與濕度，讓每一刻都舒適安心。</p>
    </section>

    <div class="section-heading">
      <div><h2>環境即時數據</h2><p>資料來源：ThingSpeak 溫溼度感測器</p></div>
      <div id="updated" class="updated">等待第一筆資料</div>
    </div>

    <section class="cards" aria-label="即時感測數據">
      <article class="metric temperature">
        <div class="metric-top"><span>目前溫度</span><span class="metric-icon" aria-hidden="true">☀</span></div>
        <div class="metric-content">
          <div class="metric-reading">
            <div id="temperature" class="metric-value">--<small>°C</small></div>
            <div id="temperatureNote" class="metric-note">等待感測器資料</div>
          </div>
          <div id="temperatureGauge" class="gauge" data-empty="true" role="img" aria-label="溫度刻度：等待資料">
            <div class="gauge-label">--</div><div class="gauge-pointer"></div>
          </div>
        </div>
        <div class="gauge-ranges">
          <span style="--color:#20c88a">低 &lt;20°C</span><span style="--color:#c99800">中 20–&lt;30°C</span><span style="--color:#f06469">高 ≥30°C</span>
          <div>刻度範圍 0–50°C</div>
        </div>
      </article>
      <article class="metric humidity">
        <div class="metric-top"><span>目前濕度</span><span class="metric-icon" aria-hidden="true">💧</span></div>
        <div class="metric-content">
          <div class="metric-reading">
            <div id="humidity" class="metric-value">--<small>%</small></div>
            <div id="humidityNote" class="metric-note">等待感測器資料</div>
          </div>
          <div id="humidityGauge" class="gauge" data-empty="true" role="img" aria-label="濕度刻度：等待資料">
            <div class="gauge-label">--</div><div class="gauge-pointer"></div>
          </div>
        </div>
        <div class="gauge-ranges">
          <span style="--color:#20c88a">低 &lt;40%</span><span style="--color:#c99800">中 40–&lt;70%</span><span style="--color:#f06469">高 ≥70%</span>
          <div>刻度範圍 0–100%</div>
        </div>
      </article>
    </section>

    <div id="error" class="error-message" role="status"></div>

    <section class="panel">
      <div class="panel-head">
        <h2>溫溼度趨勢</h2>
        <div class="legend"><span><i></i>溫度</span><span><i></i>濕度</span></div>
      </div>
      <div class="chart-wrap"><canvas id="chart" aria-label="溫度與濕度趨勢圖"></canvas></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>最新感測紀錄</h2></div>
      <div id="records" class="empty">正在載入資料…</div>
    </section>

    <footer class="footer">資料每 5 秒自動更新 · ThingSpeak IoT Dashboard</footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let latestFeeds = [];

    function validNumber(value) {
      if (value === null || value === undefined || value === "") return null;
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "時間未知";
      return new Intl.DateTimeFormat("zh-TW", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      }).format(date);
    }

    function setMetric(id, noteId, value, unit, note) {
      $(id).innerHTML = value === null ? "--<small>" + unit + "</small>"
        : value.toFixed(1) + "<small>" + unit + "</small>";
      $(noteId).textContent = note;
    }

    function setGauge(id, value, max, lowLimit, highLimit, unit) {
      const gauge = $(id);
      gauge.dataset.empty = String(value === null);
      if (value === null) {
        gauge.querySelector(".gauge-label").textContent = "--";
        gauge.setAttribute("aria-label", "刻度：無資料");
        return;
      }
      const level = value < lowLimit ? "低" : value < highLimit ? "中" : "高";
      const angle = Math.max(0, Math.min(value, max)) / max * 360;
      gauge.style.setProperty("--angle", angle + "deg");
      gauge.querySelector(".gauge-label").textContent = level;
      gauge.setAttribute("aria-label", value.toFixed(1) + unit + "，" + level);
    }

    function drawChart(feeds) {
      const canvas = $("chart");
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * ratio));
      canvas.height = Math.max(1, Math.round(rect.height * ratio));
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      const width = rect.width;
      const height = rect.height;
      const padding = { top: 16, right: 14, bottom: 26, left: 34 };
      const plotWidth = width - padding.left - padding.right;
      const plotHeight = height - padding.top - padding.bottom;
      const series = [
        { key: "temperature", color: "#ff985d", field: "field1" },
        { key: "humidity", color: "#4383f7", field: "field2" }
      ];
      const values = series.map((item) => feeds.map((feed) => validNumber(feed[item.field])));
      const all = values.flat().filter((value) => value !== null);
      if (!all.length) {
        ctx.fillStyle = "#8192a3";
        ctx.font = "13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("尚無可繪製的資料", width / 2, height / 2);
        return;
      }

      const min = Math.min(0, Math.floor(Math.min(...all) / 10) * 10);
      const max = Math.max(40, Math.ceil(Math.max(...all) / 10) * 10);
      ctx.font = "10px sans-serif";
      ctx.textAlign = "right";
      for (let tick = 0; tick <= 4; tick++) {
        const y = padding.top + plotHeight * tick / 4;
        const label = (max - (max - min) * tick / 4).toFixed(0);
        ctx.strokeStyle = "#edf2f7";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        ctx.fillStyle = "#91a0ad";
        ctx.fillText(label, padding.left - 7, y + 3);
      }

      series.forEach((item, index) => {
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 2.5;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        let started = false;
        values[index].forEach((value, point) => {
          if (value === null) { started = false; return; }
          const x = padding.left + (feeds.length <= 1 ? .5 : point / (feeds.length - 1)) * plotWidth;
          const y = padding.top + (max - value) / (max - min) * plotHeight;
          if (!started) { ctx.moveTo(x, y); started = true; }
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
    }

    function renderRecords(feeds) {
      const rows = [...feeds].reverse().slice(0, 6);
      if (!rows.length) {
        $("records").className = "empty";
        $("records").textContent = "頻道目前沒有感測紀錄。";
        return;
      }
      $("records").className = "";
      $("records").innerHTML = `
        <table class="records">
          <thead><tr><th>時間</th><th>溫度</th><th>濕度</th></tr></thead>
          <tbody>${rows.map((feed) => {
            const temperature = validNumber(feed.field1);
            const humidity = validNumber(feed.field2);
            return `<tr><td>${formatTime(feed.created_at)}</td>
              <td>${temperature === null ? "--" : temperature.toFixed(1) + " °C"}</td>
              <td>${humidity === null ? "--" : humidity.toFixed(1) + " %"}</td></tr>`;
          }).join("")}</tbody>
        </table>`;
    }

    async function refresh() {
      const connection = $("connection");
      try {
        if (window.location.protocol === "file:") {
          throw new Error("請先在專案目錄執行 python dashboard\\server.py，再開啟 http://127.0.0.1:8000/，不要直接開啟 HTML 檔案。");
        }

        let response;
        try {
          response = await fetch("/api/feeds?results=24", { cache: "no-store" });
        } catch (error) {
          if (!(error instanceof TypeError)) throw error;
          throw new Error("無法連接儀表板伺服器。請確認電腦上的儀表板伺服器正在執行，並檢查網路連線。");
        }
        if (!response.headers.get("content-type")?.includes("application/json")) {
          throw new Error("找不到儀表板資料接口。請確認使用儀表板伺服器的網址及 8000 埠，而不是其他網頁伺服器。");
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "無法取得 ThingSpeak 資料。");
        latestFeeds = Array.isArray(data.feeds) ? data.feeds : [];
        const last = [...latestFeeds].reverse().find((feed) =>
          validNumber(feed.field1) !== null || validNumber(feed.field2) !== null
        );
        if (!last) throw new Error("頻道目前沒有有效的溫溼度資料。");

        const temperature = validNumber(last.field1);
        const humidity = validNumber(last.field2);
        setMetric("temperature", "temperatureNote", temperature, "°C",
          temperature === null ? "尚無溫度資料" : (temperature >= 28 ? "氣溫偏暖，記得補充水分" : "環境溫度正常"));
        setMetric("humidity", "humidityNote", humidity, "%",
          humidity === null ? "尚無濕度資料" : (humidity >= 70 ? "濕度偏高，留意通風" : "環境濕度正常"));
        setGauge("temperatureGauge", temperature, 50, 20, 30, "°C");
        setGauge("humidityGauge", humidity, 100, 40, 70, "%");
        $("updated").textContent = "最近資料：" + formatTime(last.created_at);
        $("error").classList.remove("visible");
        $("connectionText").textContent = "資料已連線";
        connection.className = "status online";
        drawChart(latestFeeds);
        renderRecords(latestFeeds);
      } catch (error) {
        $("error").textContent = error.message || "讀取資料失敗，請稍後再試。";
        $("error").classList.add("visible");
        $("connectionText").textContent = "連線異常";
        connection.className = "status error";
        if (!latestFeeds.length) {
          $("records").className = "empty";
          $("records").textContent = "無法載入感測紀錄。";
        }
      }
    }

    window.addEventListener("resize", () => drawChart(latestFeeds));
    refresh();
    window.setInterval(refresh, 5000);
  </script>
</body>
</html>
